<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Hours Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PDF LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100 p-6">

<!-- LOGIN + SIGNUP -->
<div id="loginScreen" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow">
  <h1 class="text-2xl font-bold mb-4 text-center">Login</h1>

  <input id="username" placeholder="Username" class="border p-2 rounded w-full mb-2">

  <div class="relative mb-3">
    <input id="password" type="password" placeholder="Password" class="border p-2 rounded w-full pr-10">
    <button onclick="togglePassword('password')" class="absolute right-2 top-2 text-sm">👁</button>
  </div>

  <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded-xl w-full mb-4">
    Login
  </button>

  <hr class="my-4">

  <h2 class="text-lg font-semibold mb-2 text-center">Create Account</h2>

  <input id="newUsername" placeholder="New Username" class="border p-2 rounded w-full mb-2">

  <div class="relative mb-2">
    <input id="newPassword" type="password" placeholder="New Password" class="border p-2 rounded w-full pr-10">
    <button onclick="togglePassword('newPassword')" class="absolute right-2 top-2 text-sm">👁</button>
  </div>

  <button onclick="signup()" class="bg-green-500 text-white px-4 py-2 rounded-xl w-full">
    Sign Up
  </button>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow">

  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Work Hours Tracker</h1>
    <div>
      <span id="welcomeUser" class="mr-4 text-gray-600"></span>
      <button onclick="logout()" class="bg-gray-700 text-white px-3 py-1 rounded-xl">Logout</button>
    </div>
  </div>

  <!-- CLOCK -->
  <div class="mb-6">
    <h2 class="text-lg font-semibold mb-2">Quick Clock</h2>
    <div class="flex gap-3">
      <button onclick="clockIn()" class="bg-green-500 text-white px-4 py-2 rounded-xl">Clock In</button>
      <button onclick="clockOut()" class="bg-red-500 text-white px-4 py-2 rounded-xl">Clock Out</button>
    </div>
    <p id="status" class="mt-2 text-sm text-gray-600"></p>
  </div>

  <!-- ENTRY -->
  <div class="grid grid-cols-2 gap-4 mb-4">
    <input id="date" type="date" class="border p-2 rounded">
    <input id="hours" type="number" step="0.1" placeholder="Hours worked" class="border p-2 rounded">
  </div>

  <button onclick="addEntry()" class="bg-blue-500 text-white px-4 py-2 rounded-xl">
    Add Manual Entry
  </button>

  <!-- EXPORT -->
  <div class="mt-6">
    <h2 class="text-lg font-semibold mb-2">Export Data</h2>
    <button onclick="downloadPDF()" class="bg-purple-500 text-white px-4 py-2 rounded-xl">
      Download Monthly Report (PDF)
    </button>
  </div>

  <h2 class="text-xl font-semibold mt-6">Entries</h2>
  <ul id="entries" class="mt-2 space-y-2"></ul>

  <h2 class="text-xl font-semibold mt-6">
    Total Hours: <span id="total">0</span>
  </h2>

</div>

<script>
  let currentUser = localStorage.getItem("currentUser") || null;
  let data = [];
  let activeClock = null;

  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
  }

  function loadUserData() {
    try {
      data = JSON.parse(localStorage.getItem(`workData_${currentUser}`)) || [];
      activeClock = JSON.parse(localStorage.getItem(`activeClock_${currentUser}`)) || null;
    } catch {
      data = [];
      activeClock = null;
    }
  }

  function saveData() {
    localStorage.setItem(`workData_${currentUser}`, JSON.stringify(data));
  }

  function saveClock() {
    localStorage.setItem(`activeClock_${currentUser}`, JSON.stringify(activeClock));
  }

  function signup() {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value.trim();

    if (!username || !password) return alert("Enter username and password");

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if (users[username]) return alert("Username exists");

    users[username] = { password };
    localStorage.setItem("users", JSON.stringify(users));

    alert("Account created!");
  }

  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if (!users[username] || users[username].password !== password) {
      return alert("Invalid login");
    }

    localStorage.setItem("currentUser", username);
    currentUser = username;
    startApp();
  }

  function logout() {
    localStorage.removeItem("currentUser");
    location.reload();
  }

  function startApp() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("welcomeUser").innerText = "Hello, " + currentUser;

    loadUserData();
    render();
    updateStatus();
  }

  function clockIn() {
    if (activeClock) return alert("Already clocked in");

    activeClock = { start: new Date().toISOString() };
    saveClock();
    updateStatus();
  }

  function clockOut() {
    if (!activeClock) return alert("Not clocked in");

    const start = new Date(activeClock.start);
    const end = new Date();
    const hours = (end - start) / 3600000;

    data.push({ date: start.toISOString().split('T')[0], hours });

    activeClock = null;
    saveClock();
    saveData();
    render();
    updateStatus();
  }

  function updateStatus() {
    document.getElementById("status").innerText = activeClock
      ? "Clocked in since: " + new Date(activeClock.start).toLocaleTimeString()
      : "Not clocked in";
  }

  function addEntry() {
    const date = document.getElementById("date").value;
    const hours = parseFloat(document.getElementById("hours").value);

    if (!date || isNaN(hours)) return alert("Invalid input");

    data.push({ date, hours });
    saveData();
    render();
  }

  function deleteEntry(i) {
    data.splice(i, 1);
    saveData();
    render();
  }

  function downloadPDF() {
    if (data.length === 0) return alert("No data");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("Work Hours Report - " + currentUser, 10, 10);

    let y = 20;
    let total = 0;

    data.forEach(entry => {
      doc.text(`${entry.date} - ${entry.hours.toFixed(2)} hrs`, 10, y);
      y += 8;
      total += entry.hours;
    });

    doc.text(`Total: ${total.toFixed(2)} hrs`, 10, y + 10);

    doc.save(currentUser + "_report.pdf");
  }

  function render() {
    const list = document.getElementById("entries");
    list.innerHTML = "";

    let total = 0;

    data.forEach((e, i) => {
      total += e.hours;

      const li = document.createElement("li");
      li.className = "flex justify-between bg-gray-50 p-2 rounded";

      li.innerHTML = `
        <span>${e.date} - ${e.hours.toFixed(2)} hrs</span>
        <button onclick="deleteEntry(${i})" class="text-red-500">Delete</button>
      `;

      list.appendChild(li);
    });

    document.getElementById("total").innerText = total.toFixed(2);
  }

  if (currentUser) startApp();
</script>

</body>
</html>
