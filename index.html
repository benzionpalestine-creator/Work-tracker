<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Hours Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<!-- LOGIN + SIGNUP -->
<div id="loginScreen" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow">
  <h1 class="text-2xl font-bold mb-4 text-center">Login</h1>

  <input id="username" placeholder="Username" class="border p-2 rounded w-full mb-3">
  <input id="password" type="password" placeholder="Password" class="border p-2 rounded w-full mb-3">

  <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded-xl w-full mb-4">
    Login
  </button>

  <hr class="my-4">

  <h2 class="text-lg font-semibold mb-2 text-center">Create Account</h2>

  <input id="newUsername" placeholder="New Username" class="border p-2 rounded w-full mb-2">
  <input id="newPassword" type="password" placeholder="New Password" class="border p-2 rounded w-full mb-2">

  <button onclick="signup()" class="bg-green-500 text-white px-4 py-2 rounded-xl w-full">
    Sign Up
  </button>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow">

  <!-- TOP BAR -->
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Work Hours Tracker</h1>
    <div>
      <span id="welcomeUser" class="mr-4 text-gray-600"></span>
      <button onclick="logout()" class="bg-gray-700 text-white px-3 py-1 rounded-xl">Logout</button>
    </div>
  </div>

  <!-- CLOCK -->
  <div class="mb-6">
    <h2 class="text-lg font-semibold mb-2">Quick Clock</h2>
    <div class="flex gap-3">
      <button onclick="clockIn()" class="bg-green-500 text-white px-4 py-2 rounded-xl">Clock In</button>
      <button onclick="clockOut()" class="bg-red-500 text-white px-4 py-2 rounded-xl">Clock Out</button>
    </div>
    <p id="status" class="mt-2 text-sm text-gray-600"></p>
  </div>

  <!-- MANUAL ENTRY -->
  <div class="grid grid-cols-2 gap-4 mb-4">
    <input id="date" type="date" class="border p-2 rounded">
    <input id="hours" type="number" step="0.1" placeholder="Hours worked" class="border p-2 rounded">
  </div>

  <button onclick="addEntry()" class="bg-blue-500 text-white px-4 py-2 rounded-xl">
    Add Manual Entry
  </button>

  <!-- EXPORT -->
  <div class="mt-6">
    <h2 class="text-lg font-semibold mb-2">Export Data</h2>
    <button onclick="downloadCSV()" class="bg-purple-500 text-white px-4 py-2 rounded-xl">
      Download Monthly Report (CSV)
    </button>
  </div>

  <h2 class="text-xl font-semibold mt-6">Entries</h2>
  <ul id="entries" class="mt-2 space-y-2"></ul>

  <h2 class="text-xl font-semibold mt-6">
    Total Hours: <span id="total">0</span>
  </h2>

</div>

<script>
  let currentUser = localStorage.getItem("currentUser");
  let data = [];
  let activeClock = null;

  function loadUserData() {
    if (!currentUser) return;

    data = JSON.parse(localStorage.getItem(`workData_${currentUser}`)) || [];
    activeClock = JSON.parse(localStorage.getItem(`activeClock_${currentUser}`)) || null;
  }

  function saveData() {
    localStorage.setItem(`workData_${currentUser}`, JSON.stringify(data));
  }

  function saveClock() {
    localStorage.setItem(`activeClock_${currentUser}`, JSON.stringify(activeClock));
  }

  function signup() {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value.trim();

    if (!username || !password) {
      alert("Enter username and password");
      return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if (users[username]) {
      alert("Username already exists");
      return;
    }

    users[username] = { password };
    localStorage.setItem("users", JSON.stringify(users));

    alert("Account created! You can now log in.");
  }

  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if (!users[username] || users[username].password !== password) {
      alert("Invalid username or password");
      return;
    }

    localStorage.setItem("currentUser", username);
    currentUser = username;

    startApp();
  }

  function logout() {
    localStorage.removeItem("currentUser");
    location.reload();
  }

  function startApp() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("welcomeUser").innerText = `Hello, ${currentUser}`;

    loadUserData();
    render();
    updateStatus();
  }

  function clockIn() {
    if (activeClock) return alert('Already clocked in');

    activeClock = { start: new Date().toISOString() };
    saveClock();
    updateStatus();
  }

  function clockOut() {
    if (!activeClock) return alert('You are not clocked in');

    const start = new Date(activeClock.start);
    const end = new Date();
    const diff = (end - start) / (1000 * 60 * 60);

    const date = start.toISOString().split('T')[0];
    data.push({ date, hours: diff });

    activeClock = null;
    saveClock();
    saveData();
    render();
    updateStatus();
  }

  function updateStatus() {
    const status = document.getElementById('status');
    status.innerText = activeClock
      ? 'Clocked in since: ' + new Date(activeClock.start).toLocaleTimeString()
      : 'Not clocked in';
  }

  function addEntry() {
    const date = document.getElementById('date').value;
    const hours = parseFloat(document.getElementById('hours').value);

    if (!date || isNaN(hours)) return alert('Enter valid data');

    data.push({ date, hours });
    saveData();
    render();
  }

  function deleteEntry(index) {
    data.splice(index, 1);
    saveData();
    render();
  }

  function downloadCSV() {
    if (data.length === 0) return alert('No data');

    let csv = 'Date,Hours\n';
    data.forEach(e => {
      csv += `${e.date},${e.hours.toFixed(2)}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentUser}_work_report.csv`;
    a.click();

    URL.revokeObjectURL(url);
  }

  function render() {
    const list = document.getElementById('entries');
    list.innerHTML = '';

    let total = 0;

    data.forEach((entry, i) => {
      total += entry.hours;

      const li = document.createElement('li');
      li.className = 'flex justify-between bg-gray-50 p-2 rounded';

      li.innerHTML = `
        <span>${entry.date} - ${entry.hours.toFixed(2)} hrs</span>
        <button onclick="deleteEntry(${i})" class="text-red-500">Delete</button>
      `;

      list.appendChild(li);
    });

    document.getElementById('total').innerText = total.toFixed(2);
  }

  // AUTO LOGIN
  if (currentUser) {
    startApp();
  }
</script>

</body>
</html>
