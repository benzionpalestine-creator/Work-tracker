<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Hours Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "PASTE_HERE",
      authDomain: "PASTE_HERE",
      projectId: "PASTE_HERE",
      storageBucket: "PASTE_HERE",
      messagingSenderId: "PASTE_HERE",
      appId: "PASTE_HERE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.auth = auth;
    window.db = db;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.signOut = signOut;
    window.setDoc = setDoc;
    window.doc = doc;
    window.getDoc = getDoc;
  </script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100 p-6">

<!-- LOGIN -->
<div id="loginScreen" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow">
  <h1 class="text-2xl font-bold mb-4 text-center">Login</h1>

  <input id="username" placeholder="Email" class="border p-2 rounded w-full mb-2">

  <div class="relative mb-3">
    <input id="password" type="password" placeholder="Password" class="border p-2 rounded w-full pr-10">
    <button onclick="togglePassword('password')" class="absolute right-2 top-2">👁</button>
  </div>

  <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded-xl w-full mb-4">Login</button>

  <hr class="my-4">

  <h2 class="text-lg font-semibold text-center mb-2">Create Account</h2>

  <input id="newUsername" placeholder="Email" class="border p-2 rounded w-full mb-2">

  <div class="relative mb-2">
    <input id="newPassword" type="password" placeholder="Password" class="border p-2 rounded w-full pr-10">
    <button onclick="togglePassword('newPassword')" class="absolute right-2 top-2">👁</button>
  </div>

  <button onclick="signup()" class="bg-green-500 text-white px-4 py-2 rounded-xl w-full">Sign Up</button>
</div>

<!-- APP -->
<div id="app" class="hidden max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow">

  <div class="flex justify-between mb-4">
    <h1 class="text-2xl font-bold">Work Tracker</h1>
    <button onclick="logout()" class="bg-gray-700 text-white px-3 py-1 rounded-xl">Logout</button>
  </div>

  <button onclick="clockIn()" class="bg-green-500 text-white px-4 py-2 rounded-xl">Clock In</button>
  <button onclick="clockOut()" class="bg-red-500 text-white px-4 py-2 rounded-xl ml-2">Clock Out</button>

  <p id="status" class="mt-2"></p>

  <div class="mt-4">
    <input id="date" type="date" class="border p-2 rounded">
    <input id="hours" type="number" placeholder="Hours" class="border p-2 rounded">
    <button onclick="addEntry()" class="bg-blue-500 text-white px-3 py-2 rounded">Add</button>
  </div>

  <button onclick="downloadPDF()" class="bg-purple-500 text-white px-4 py-2 rounded-xl mt-4">
    Download PDF
  </button>

  <ul id="entries" class="mt-4"></ul>
  <h2>Total: <span id="total">0</span></h2>

</div>

<script>
let currentUser = null;
let data = [];
let activeClock = null;

function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

async function signup() {
  const email = newUsername.value;
  const password = newPassword.value;

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("Account created!");
  } catch (e) {
    alert(e.message);
  }
}

async function login() {
  try {
    const res = await signInWithEmailAndPassword(auth, username.value, password.value);
    currentUser = res.user.uid;
    startApp();
  } catch {
    alert("Login failed");
  }
}

async function logout() {
  await signOut(auth);
  location.reload();
}

async function saveData() {
  await setDoc(doc(db, "users", currentUser), { data });
}

async function loadUserData() {
  const snap = await getDoc(doc(db, "users", currentUser));
  data = snap.exists() ? snap.data().data : [];
}

function startApp() {
  loginScreen.style.display = "none";
  app.style.display = "block";
  loadUserData().then(render);
}

function clockIn() {
  activeClock = { start: new Date().toISOString() };
  updateStatus();
}

function clockOut() {
  if (!activeClock) return;
  const start = new Date(activeClock.start);
  const hours = (new Date() - start) / 3600000;
  data.push({ date: start.toISOString().split('T')[0], hours });
  activeClock = null;
  saveData();
  render();
}

function updateStatus() {
  status.innerText = activeClock ? "Clocked in" : "Not clocked in";
}

function addEntry() {
  data.push({ date: date.value, hours: parseFloat(hours.value) });
  saveData();
  render();
}

function render() {
  entries.innerHTML = "";
  let total = 0;

  data.forEach(e => {
    total += e.hours;
    entries.innerHTML += `<li>${e.date} - ${e.hours.toFixed(2)} hrs</li>`;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 10;
  data.forEach(e => {
    doc.text(`${e.date} - ${e.hours.toFixed(2)} hrs`, 10, y);
    y += 10;
  });

  doc.save("report.pdf");
}
</script>

</body>
</html>
